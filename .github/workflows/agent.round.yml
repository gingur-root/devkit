name: Round

# One review round inside a build run. Round 0 reviews the build's commit. Each
# later round repairs the previous findings or reruns a stale review on the
# current PR head without a repair. Repairs push to the same PR branch. Each
# round verifies and reviews its candidate; reruns count toward the rounds cap
# (up to 10). The verdict marks a clean pass with CI green on that same commit
# ready, starts the next round when the findings (CI's included) are Codex's to
# fix and rounds are left, and otherwise moves the card to Needs you.
# Each repair runs replan → gate → repair; spec changes wait for /approve.
# The pipeline never merges. agent.build.yml calls this once per round.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Self-hosted runner label: callers pass vars.RUNNER.'
        type: string
        required: true
      appId:
        description: 'The pipeline App ID: callers pass vars.PIPELINE_APP_ID.'
        type: string
        required: true
      executor:
        description: "Override the agents' executor; `stub` for smoke runs."
        type: string
        required: false
        default: ''
      fixture:
        description: 'The stub fixture: `ready`, `invalid`, `needs-you`, `rate-limit`, `red`, `story`, `followups` or `unverified`.'
        type: string
        required: false
        default: 'ready'
      devkitRef:
        description: 'The devkit ref the jobs run.'
        type: string
        required: false
        default: 'main'
      issue:
        description: 'A manual (workflow_dispatch) run: the issue to run on. Unset on issue events.'
        type: string
        required: false
        default: ''
      round:
        description: '0 reviews the build; n repairs or reruns, then reviews, for the nth time.'
        type: number
        required: true
      rounds:
        description: 'The repair or rerun cap, from 0 to 10.'
        type: number
        required: true
      base:
        description: "The build's base commit, used to review the whole change."
        type: string
        required: true
      rerun:
        description: 'Review the candidate again without a repair.'
        type: boolean
        default: false
      candidate:
        description: 'The reviewed commit to repair, or the PR head to review on a rerun.'
        type: string
        required: true
      criteria:
        description: 'Round 0: the approved plan has agent criteria.'
        type: boolean
        default: false
      readToken:
        description: "Round 0: the reviewer's sealed read token (actions/agent.token). Later rounds: the replan's."
        type: string
        required: false
        default: ''
      repo:
        description: 'The target repo in gingur-root, when the central caller (gingur-root/pipeline) dispatched the run. Empty: the calling repo.'
        type: string
        required: false
        default: ''
    # Optional: the jobs that use them read the `agents` environment's copies
    # (infra#150), which win over anything passed in.
    secrets:
      AGENTS_SECRETS_TOKEN:
        required: false
      PIPELINE_SECRETS_TOKEN:
        required: false
    outputs:
      next:
        description: 'The next step: ready, repair, rerun, spec or stop.'
        value: ${{ jobs.verdict.outputs.next || (jobs.gate.outputs.next != 'repair' && jobs.gate.outputs.next || '') }}
      candidate:
        description: 'The reviewed commit to repair, or the current PR head to re-review.'
        value: ${{ jobs.verdict.outputs.candidate || jobs.gate.outputs.candidate }}
      retro:
        description: '`true` when this round left the card in Needs you.'
        value: ${{ jobs.verdict.outputs.retro }}
      readToken:
        description: "The next round's sealed read token for its replan, when `next` is `repair`."
        value: ${{ jobs.verdict.outputs.readToken }}

permissions: {}

jobs:
  replan:
    name: Replan
    if: (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && inputs.round > 0 && !inputs.rerun
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: replan
          prefix: replan-${{ inputs.round }}
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ inputs.candidate }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          readToken: ${{ inputs.readToken }}
          devkitRef: ${{ inputs.devkitRef }}

  gate:
    name: Gate
    needs: replan
    if: always() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && inputs.round > 0 && !inputs.rerun
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      next: ${{ steps.publish.outputs.next }}
      candidate: ${{ steps.publish.outputs.head }}
      readToken: ${{ steps.read.outputs.sealed }}
    steps:
      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionContents: read
          permissionIssues: write
          permissionPullRequests: write
          permissionOrganizationProjects: write

      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: replan-${{ inputs.round }}-in
          path: ${{ runner.temp }}/replan/in

      # Missing when the replan job died before writing anything; publish names that stage.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: replan-${{ inputs.round }}-out
          path: ${{ runner.temp }}/replan/out

      # Publish must report a validate stop even if installing its scanner fails.
      - uses: gingur-root/devkit/actions/secrets.scan@main
        continue-on-error: true
        with:
          installOnly: 'true'

      - id: publish
        name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ROUND: ${{ inputs.round }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          pnpm agent publish --in "$RUNNER_TEMP/replan/in" --out "$RUNNER_TEMP/replan/out" \
            --round "$ROUND" --rounds "$ROUNDS"

      # Render repair after planner replies, so it sees the thread discussion.
      - id: memory
        if: steps.publish.outputs.repair == 'true'
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          repositories: pipeline
          permissionContents: read

      - id: next
        name: Render repair
        if: steps.publish.outputs.repair == 'true'
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MEMORY_TOKEN: ${{ steps.memory.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          APP_ID: ${{ inputs.appId }}
          ROUND: ${{ inputs.round }}
          BASE: ${{ inputs.base }}
        run: |
          job="$RUNNER_TEMP/replan/in/job.json"
          candidate=$(node -p 'require(process.argv[1]).source' "$job")
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role repair --source "$candidate" \
            --base "$BASE" --app-id "$APP_ID" --out "$RUNNER_TEMP/repair/in"
          cp "$RUNNER_TEMP/replan/in/review.json" "$RUNNER_TEMP/repair/in/review.json"
          {
            echo "candidate=$candidate"
            echo "artifact=repair-${ROUND}-in"
            echo "pack=repair-${ROUND}-repo"
          } >>"$GITHUB_OUTPUT"

      - if: steps.next.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.next.outputs.artifact }}
          path: ${{ runner.temp }}/repair/in

      - if: steps.next.outputs.artifact != ''
        uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ steps.next.outputs.candidate }}
          token: ${{ steps.app.outputs.token }}
          name: ${{ steps.next.outputs.pack }}

      # The repair's read token.
      - id: read
        if: steps.publish.outputs.repair == 'true'
        uses: gingur-root/devkit/actions/agent.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          key: ${{ secrets.AGENTS_SECRETS_TOKEN }}

  repair:
    name: Repair
    needs: gate
    if: (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && inputs.round > 0 && !inputs.rerun && needs.gate.outputs.next == 'repair'
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: repair
          prefix: repair-${{ inputs.round }}
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ inputs.candidate }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          readToken: ${{ needs.gate.outputs.readToken }}
          devkitRef: ${{ inputs.devkitRef }}

  push:
    name: Push
    needs: repair
    if: ${{ !cancelled() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && inputs.round > 0 && (needs.repair.result != 'skipped' || inputs.rerun) }}
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      candidate: ${{ inputs.rerun && inputs.candidate || steps.publish.outputs.candidate }}
      readToken: ${{ steps.read.outputs.sealed }}
      criteria: ${{ steps.criteria.outputs.criteria }}
    steps:
      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionContents: write
          permissionIssues: write
          permissionPullRequests: write
          permissionOrganizationProjects: write
          # Agents push workflow files like any file (infra#150).
          permissionWorkflows: write

      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      # The push target. Its credentials stay in repo/.git for publish's git push.
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ref: ${{ inputs.candidate }}
          path: repo
          token: ${{ steps.app.outputs.token }}

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - if: ${{ !inputs.rerun }}
        uses: actions/download-artifact@v8
        with:
          name: repair-${{ inputs.round }}-in
          path: ${{ runner.temp }}/agent/in

      # Missing when the repair job died before writing anything; publish names that stage.
      - if: ${{ !inputs.rerun }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: repair-${{ inputs.round }}-out
          path: ${{ runner.temp }}/agent/out

      # Publish must report a validate stop even if installing its scanner fails.
      - uses: gingur-root/devkit/actions/secrets.scan@main
        continue-on-error: true
        with:
          installOnly: 'true'

      - id: publish
        if: ${{ !inputs.rerun }}
        name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ROUND: ${{ inputs.round }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          pnpm agent publish --in "$RUNNER_TEMP/agent/in" --out "$RUNNER_TEMP/agent/out" \
            --checkout "$GITHUB_WORKSPACE/repo" --round "$ROUND" --rounds "$ROUNDS"

      # The review sees the whole change since the build's base, not just this fix.
      - id: memory
        if: steps.publish.outputs.candidate != '' || inputs.rerun
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          repositories: pipeline
          permissionContents: read

      - id: criteria
        name: Render review and verifier
        if: steps.publish.outputs.candidate != '' || inputs.rerun
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MEMORY_TOKEN: ${{ steps.memory.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          CANDIDATE: ${{ inputs.rerun && inputs.candidate || steps.publish.outputs.candidate }}
          APP_ID: ${{ inputs.appId }}
          BASE: ${{ inputs.base }}
        run: |
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role review --source "$CANDIDATE" \
            --base "$BASE" --app-id "$APP_ID" --out "$RUNNER_TEMP/review/in"
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role verify --source "$CANDIDATE" \
            --base "$BASE" --app-id "$APP_ID" --out "$RUNNER_TEMP/verify/in"
          echo "criteria=$(node -p 'Object.values(require(process.argv[1]).plan.checks).includes("agent")' "$RUNNER_TEMP/verify/in/job.json")" >>"$GITHUB_OUTPUT"
          git -C "$GITHUB_WORKSPACE/repo" fetch --depth=1 origin "$BASE"
          git -C "$GITHUB_WORKSPACE/repo" diff --binary "$BASE" "$CANDIDATE" >"$RUNNER_TEMP/review/in/candidate.patch"

      - if: steps.publish.outputs.candidate != '' || inputs.rerun
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ inputs.round }}-in
          path: ${{ runner.temp }}/verify/in

      - if: steps.publish.outputs.candidate != '' || inputs.rerun
        uses: actions/upload-artifact@v7
        with:
          name: review-${{ inputs.round }}-in
          path: ${{ runner.temp }}/review/in

      - if: steps.publish.outputs.candidate != '' || inputs.rerun
        uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ inputs.rerun && inputs.candidate || steps.publish.outputs.candidate }}
          token: ${{ steps.app.outputs.token }}
          name: review-${{ inputs.round }}-repo

      # The reviewer's read token.
      - id: read
        if: steps.publish.outputs.candidate != '' || inputs.rerun
        uses: gingur-root/devkit/actions/agent.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          key: ${{ secrets.AGENTS_SECRETS_TOKEN }}

  review:
    name: Review
    needs: push
    # Round 0 skips push, so its candidate is the input.
    if: ${{ !cancelled() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && (inputs.round == 0 || needs.push.outputs.candidate != '') }}
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: review
          prefix: review-${{ inputs.round }}
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ needs.push.outputs.candidate || inputs.candidate }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          # Round 0's comes from the caller's publish, a repair round's from push.
          readToken: ${{ inputs.round == 0 && inputs.readToken || needs.push.outputs.readToken }}
          devkitRef: ${{ inputs.devkitRef }}

  criteria:
    name: Verify Criteria
    needs: push
    # Round 0 skips push, so its candidate is the input.
    if: ${{ !cancelled() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && (inputs.round == 0 || needs.push.outputs.candidate != '') && ((inputs.round == 0 && inputs.criteria) || (inputs.round > 0 && needs.push.outputs.criteria == 'true')) }}
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: verify
          prefix: verify-${{ inputs.round }}
          pack: review-${{ inputs.round }}-repo
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ needs.push.outputs.candidate || inputs.candidate }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          # Round 0's comes from the caller's publish, a repair round's from push.
          readToken: ${{ inputs.round == 0 && inputs.readToken || needs.push.outputs.readToken }}
          devkitRef: ${{ inputs.devkitRef }}

  # CI on the same commit the review reads (devkit#9). A repo's own checks are
  # the scripts toolchain.verify runs; Ready needs them green.
  verify:
    name: Verify
    needs: push
    if: ${{ !cancelled() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && (inputs.round == 0 || needs.push.outputs.candidate != '') }}
    permissions:
      contents: read
    uses: ./.github/workflows/toolchain.verify.yml
    with:
      runner: ${{ inputs.runner }}
      ref: ${{ needs.push.outputs.candidate || inputs.candidate }}
      # Round 0's pack comes from the build's publish, a repair round's from push.
      pack: review-${{ inputs.round }}-repo
      # Red CI is a finding for the repair, not a failed run.
      report: true

  verdict:
    name: Verdict
    needs: [push, review, verify, criteria]
    if: always() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && (inputs.round == 0 || needs.push.outputs.candidate != '')
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      next: ${{ steps.publish.outputs.next }}
      retro: ${{ steps.publish.outputs.retro }}
      candidate: ${{ steps.next.outputs.candidate || steps.publish.outputs.head }}
      readToken: ${{ steps.read.outputs.sealed }}
    steps:
      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          # Marking a draft ready needs contents: write as well as pull_requests.
          permissionContents: write
          permissionIssues: write
          permissionPullRequests: write
          permissionOrganizationProjects: write

      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        with:
          name: review-${{ inputs.round }}-in
          path: ${{ runner.temp }}/review/in

      # Missing when the review job died before writing anything; publish names that stage.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: review-${{ inputs.round }}-out
          path: ${{ runner.temp }}/review/out

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: verify-${{ inputs.round }}-in
          path: ${{ runner.temp }}/verify/in

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: verify-${{ inputs.round }}-out
          path: ${{ runner.temp }}/verify/out

      # Publish must report a validate stop even if installing its scanner fails.
      - uses: gingur-root/devkit/actions/secrets.scan@main
        continue-on-error: true
        with:
          installOnly: 'true'

      - id: publish
        name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ROUND: ${{ inputs.round }}
          ROUNDS: ${{ inputs.rounds }}
          VERIFIED: ${{ needs.verify.outputs.verified }}
        run: |
          pnpm agent publish --in "$RUNNER_TEMP/review/in" --out "$RUNNER_TEMP/review/out" \
            --round "$ROUND" --rounds "$ROUNDS" --verified "$VERIFIED" \
            --verifier-in "$RUNNER_TEMP/verify/in" --verifier-out "$RUNNER_TEMP/verify/out"

      # The next round's replan job: the reviewed commit, the build's base, and this review.
      - id: memory
        if: steps.publish.outputs.repair == 'true'
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          repositories: pipeline
          permissionContents: read

      - id: next
        name: Render replan
        if: steps.publish.outputs.repair == 'true'
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MEMORY_TOKEN: ${{ steps.memory.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          APP_ID: ${{ inputs.appId }}
          ROUND: ${{ inputs.round }}
        run: |
          job="$RUNNER_TEMP/review/in/job.json"
          candidate=$(node -p 'require(process.argv[1]).candidate' "$job")
          base=$(node -p 'require(process.argv[1]).base' "$job")
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role replan --source "$candidate" \
            --base "$base" --app-id "$APP_ID" --out "$RUNNER_TEMP/replan/in"
          cp "$RUNNER_TEMP/review/out/review.json" "$RUNNER_TEMP/replan/in/review.json"
          {
            echo "candidate=$candidate"
            echo "artifact=replan-$((ROUND + 1))-in"
            echo "pack=replan-$((ROUND + 1))-repo"
          } >>"$GITHUB_OUTPUT"

      - if: steps.next.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.next.outputs.artifact }}
          path: ${{ runner.temp }}/replan/in

      - if: steps.next.outputs.artifact != ''
        uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ steps.next.outputs.candidate }}
          token: ${{ steps.app.outputs.token }}
          name: ${{ steps.next.outputs.pack }}

      # The next round's replan read token.
      - id: read
        if: steps.publish.outputs.repair == 'true'
        uses: gingur-root/devkit/actions/agent.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          key: ${{ secrets.AGENTS_SECRETS_TOKEN }}
