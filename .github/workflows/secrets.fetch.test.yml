name: secrets.fetch

# Run the PR's composite, since production callers pin @main.
on:
  pull_request:
    paths:
      - 'actions/secrets.fetch/**'
      - '.github/workflows/secrets.fetch.test.yml'

permissions:
  contents: read

jobs:
  test:
    name: secrets.fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: start
        run: echo "time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: fetch
        uses: ./actions/secrets.fetch
        continue-on-error: true
        with:
          token: invalid
          secrets: |
            00000000-0000-4000-8000-000000000000 > TEST_SECRET

      - name: Check failure and retry waits
        env:
          OUTCOME: ${{ steps.fetch.outcome }}
          START: ${{ steps.start.outputs.time }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          echo "Fetch outcome: $OUTCOME; elapsed: ${elapsed}s"
          test "$OUTCOME" = failure
          test "$elapsed" -ge 7
