name: Smoke

# By hand only. Proves the credential chain end to end: the App key from
# Bitwarden `pipeline` (secrets.fetch), a token for scratch
# (app.token), and a read of scratch's issues with it.

on: workflow_dispatch

permissions: {}

jobs:
  smoke:
    name: Smoke
    if: github.repository_owner_id == '340382989' && github.actor_id == '2553213' && github.run_attempt == '1' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise'))))
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ vars.PIPELINE_APP_ID }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          repositories: scratch
          permissionIssues: read

      - name: Read scratch's issues
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh issue list --repo gingur-root/scratch --state all --limit 5
