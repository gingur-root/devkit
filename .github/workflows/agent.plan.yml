name: Plan

# agent:plan on an issue, or a /plan comment: render the job, run the planner,
# publish the plan as one marker comment and move the card to Needs you.
# Callers set concurrency (one group per card) at their own workflow level.
# With `runner: wsl` every job runs on the operator's WSL desk, as him, with no
# pipeline or agent secrets: his `gh` publishes and his Claude login plans.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label: callers pass vars.RUNNER.'
        type: string
        required: false
        default: 'ubuntu-latest'
      appId:
        description: 'The pipeline App ID: callers pass vars.PIPELINE_APP_ID.'
        type: string
        required: true
      executor:
        description: "Override the planner's executor; `stub` for smoke runs."
        type: string
        required: false
        default: ''
      fixture:
        description: 'The stub fixture: `ready`, `invalid` or `needs-you`.'
        type: string
        required: false
        default: 'ready'
      devkitRef:
        description: 'The devkit ref the jobs run.'
        type: string
        required: false
        default: 'main'
      issue:
        description: 'A manual (workflow_dispatch) run: the issue to run on. Unset on issue events.'
        type: string
        required: false
        default: ''
    secrets:
      # Both unset on the WSL desk.
      AGENTS_SECRETS_TOKEN:
        required: false
      PIPELINE_SECRETS_TOKEN:
        required: false

permissions: {}

jobs:
  start:
    name: Start
    if: (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","agent:elevated","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:plan'))) && ((github.event_name == 'issues' && github.event.label.name == 'agent:plan') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/plan') && !github.event.issue.pull_request) || (github.event_name == 'workflow_dispatch' && inputs.issue != ''))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      # The WSL desk mints no App token: the operator's own `gh` writes there
      # (bin/agent/github.ts), for repos the App can't reach (infra#47).
      - id: app
        if: inputs.runner != 'wsl'
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionIssues: write
          permissionOrganizationProjects: write

      - name: Render
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          SOURCE: ${{ github.sha }}
          APP_ID: ${{ inputs.appId }}
        run: |
          pnpm agent status --repo "$REPO" --issue "$ISSUE" --status Planning
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role plan --source "$SOURCE" \
            --app-id "$APP_ID" --out "$RUNNER_TEMP/agent/in"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-in
          path: ${{ runner.temp }}/agent/in

  plan:
    name: Plan
    needs: start
    if: (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","agent:elevated","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:plan'))) && ((github.event_name == 'issues' && github.event.label.name == 'agent:plan') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/plan') && !github.event.issue.pull_request) || (github.event_name == 'workflow_dispatch' && inputs.issue != ''))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: plan
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ github.sha }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          devkitRef: ${{ inputs.devkitRef }}

  publish:
    name: Publish
    needs: [start, plan]
    if: always() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","agent:elevated","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:plan'))) && ((github.event_name == 'issues' && github.event.label.name == 'agent:plan') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/plan') && !github.event.issue.pull_request) || (github.event_name == 'workflow_dispatch' && inputs.issue != '')) && needs.start.result == 'success'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        with:
          name: agent-in
          path: ${{ runner.temp }}/agent/in

      # Missing when the plan job died before writing anything; publish names that stage.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: agent-out
          path: ${{ runner.temp }}/agent/out

      # The WSL desk mints no App token: the operator's own `gh` writes there
      # (bin/agent/github.ts), for repos the App can't reach (infra#47).
      - id: app
        if: inputs.runner != 'wsl'
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionIssues: write
          permissionOrganizationProjects: write

      - name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: pnpm agent publish --in "$RUNNER_TEMP/agent/in" --out "$RUNNER_TEMP/agent/out"

  # A plan that asked questions is the normal flow; only a failed job gets a retro.
  retro:
    name: Retro
    needs: [start, plan, publish]
    if: always() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","agent:elevated","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:plan'))) && contains(needs.*.result, 'failure')
    # The ceiling for the nested jobs: the agent checks out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.retro.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      issue: ${{ inputs.issue }}
      jobs: ${{ toJSON(needs) }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  # The run's last word, however it ended (devkit#47): a card it left in
  # Planning or Building goes to Needs you, then the repo's next ready card
  # starts planning.
  next:
    name: Next
    needs: [start, plan, publish, retro]
    if: always() && (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","agent:elevated","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:plan'))) && needs.start.result != 'skipped'
    uses: ./.github/workflows/agent.loop.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      devkitRef: ${{ inputs.devkitRef }}
      role: plan
      issue: ${{ inputs.issue }}
      jobs: ${{ toJSON(needs) }}
    secrets:
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
