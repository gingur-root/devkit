name: Verify

# Format, lint, typecheck, test and build a repo with its own declared
# toolchain (.node-version, package.json packageManager), set up by Vite+.

on:
  workflow_call:
    inputs:
      cwd:
        description: 'Directory containing package.json and runtime version files.'
        type: string
        required: false
        default: '.'
      node:
        description: 'Optional Node.js override. Prefer .node-version.'
        type: string
        required: false
        default: ''
      format:
        description: 'pnpm script for the format check. Empty skips it.'
        type: string
        required: false
        default: 'fmt:check'
      lint:
        description: 'pnpm script for lint. Empty skips it.'
        type: string
        required: false
        default: 'lint'
      typecheck:
        description: 'pnpm script for typecheck. Empty skips it.'
        type: string
        required: false
        default: 'typecheck'
      test:
        description: 'pnpm script for tests. Empty skips them.'
        type: string
        required: false
        default: 'test'
      build:
        description: 'pnpm script for build. Empty skips it, and so does a repo without that script.'
        type: string
        required: false
        default: 'build'
      runner:
        description: 'Runner label: callers pass vars.RUNNER. A public repo never passes `local`.'
        type: string
        required: false
        default: 'ubuntu-latest'
      ref:
        description: 'The commit to verify. Empty verifies the event commit.'
        type: string
        required: false
        default: ''
      pack:
        description: 'An artifact from repo.pack to verify instead of checking out this repo: how the central caller verifies another repo (devkit#118).'
        type: string
        required: false
        default: ''
      report:
        description: 'Report a failed check in `verified` instead of failing the job.'
        type: boolean
        required: false
        default: false
    outputs:
      failed:
        description: 'The failed checks, comma-separated in run order; empty when none failed or report is false.'
        value: ${{ jobs.verify.outputs.failed }}
      verified:
        description: 'The commit, when every check passed on it; empty otherwise.'
        value: ${{ jobs.verify.outputs.verified }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      failed: ${{ steps.failed.outputs.failed }}
      verified: ${{ steps.verified.outputs.verified }}
    defaults:
      run:
        working-directory: ${{ inputs.cwd }}
    steps:
      - if: inputs.pack == ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - if: inputs.pack != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.pack }}
          path: ${{ runner.temp }}/pack

      # A self-hosted runner keeps the workspace between jobs.
      - if: inputs.pack != ''
        working-directory: .
        run: |
          find . -mindepth 1 -delete
          tar -xzf "$RUNNER_TEMP/pack/repo.tgz"
          rm -rf "$RUNNER_TEMP/pack"

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: ${{ inputs.cwd }}
          node: ${{ inputs.node }}

      - id: format
        name: Format
        continue-on-error: ${{ inputs.report }}
        if: ${{ inputs.format != '' }}
        run: pnpm "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.format }}

      - id: lint
        name: Lint
        continue-on-error: ${{ inputs.report }}
        if: ${{ inputs.lint != '' }}
        run: pnpm "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.lint }}

      - id: typecheck
        name: Typecheck
        continue-on-error: ${{ inputs.report }}
        if: ${{ inputs.typecheck != '' }}
        run: pnpm "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.typecheck }}

      - id: test
        name: Test
        continue-on-error: ${{ inputs.report }}
        if: ${{ inputs.test != '' }}
        run: pnpm "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.test }}

      - id: build
        name: Build
        continue-on-error: ${{ inputs.report }}
        if: ${{ inputs.build != '' }}
        # A source-only repo has no build, and callers like review pass the default.
        run: pnpm run --if-present "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.build }}

      # Without `report` a failed check ends the job before this.
      - id: verified
        if: steps.format.outcome != 'failure' && steps.lint.outcome != 'failure' && steps.typecheck.outcome != 'failure' && steps.test.outcome != 'failure' && steps.build.outcome != 'failure'
        run: echo "verified=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - id: failed
        if: inputs.report
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          failed=()
          for check in format lint typecheck test build; do
            outcome="${check^^}"
            if [[ "${!outcome}" == failure ]]; then
              failed+=("$check")
            fi
          done
          (IFS=,; echo "failed=${failed[*]}") >>"$GITHUB_OUTPUT"
