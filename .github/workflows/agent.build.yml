name: Build

# An /approve comment (or agent:build) on an issue with a ready plan: render
# the job from the plan comment, run the builder, then push its change to
# agent/issue-<n>, open a draft PR and move the card to Ready. Then CI
# (toolchain.verify) and Claude check that exact commit (agent.round.yml): a
# clean pass with CI green marks the PR ready
# and leaves the card in Ready for the operator to merge. Findings Codex can fix
# get up to 10 rounds on the same PR (the rounds input), one `repair-<n>` job
# each. Stale reviews rerun on the PR head and count as rounds. Anything else
# moves the card to Needs you.
# Each repair runs a planner first; /approve after a spec stop skips build
# and re-reviews the stopped round on the same PR.
# The pipeline never merges. Only the operator can start it (the admission
# gate), so that comment is the approval, or the App right after his dashboard
# Continue, which render checks (bin/agent/approval.ts) against the dispatcher:
# inputs.actor when the central caller dispatched the run, else github.actor_id.
# A retro issue's plan (devkit#115) skips the builder: publish files the issues
# its triage kept and closes the retro issue.
# A story (an issue with sub-issues) is refused and goes to Needs you: build
# each subtask instead (devkit#12).
# Callers set concurrency (one group per card) at their own workflow level.

on:
  workflow_call:
    inputs:
      # Required: the builder needs the runners' Codex login, so never GitHub-hosted.
      runner:
        description: 'Self-hosted runner label: callers pass vars.RUNNER.'
        type: string
        required: true
      appId:
        description: 'The pipeline App ID: callers pass vars.PIPELINE_APP_ID.'
        type: string
        required: true
      executor:
        description: "Override the builder's executor; `stub` for smoke runs."
        type: string
        required: false
        default: ''
      fixture:
        description: 'The stub fixture: `ready`, `invalid`, `needs-you`, `rate-limit`, `red`, `story`, `followups`, `unverified`, `critique` or `critique-pass`.'
        type: string
        required: false
        default: 'ready'
      rounds:
        description: 'The repair or rerun cap, from 0 to 10.'
        type: number
        default: 10
      devkitRef:
        description: 'The devkit ref the jobs run.'
        type: string
        required: false
        default: 'main'
      issue:
        description: 'A manual (workflow_dispatch) run: the issue to run on. Unset on issue events.'
        type: string
        required: false
        default: ''
      actor:
        description: "The event's sender, when the central caller dispatched the run. Empty: github.actor_id."
        type: string
        required: false
        default: ''
      repo:
        description: 'The target repo in gingur-root, when the central caller (gingur-root/pipeline) dispatched the run. Empty: the calling repo.'
        type: string
        required: false
        default: ''
    # Optional: the jobs that use them read the `agents` environment's copies
    # (infra#150), which win over anything passed in.
    secrets:
      AGENTS_SECRETS_TOKEN:
        required: false
      PIPELINE_SECRETS_TOKEN:
        required: false

permissions: {}

jobs:
  start:
    name: Start
    if: (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && ((github.event_name == 'issues' && github.event.label.name == 'agent:build') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/approve') && !github.event.issue.pull_request) || (github.event_name == 'workflow_dispatch' && inputs.issue != ''))
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      source: ${{ steps.render.outputs.source }}
      base: ${{ steps.render.outputs.base }}
      resume: ${{ steps.render.outputs.resume }}
      candidate: ${{ steps.render.outputs.candidate }}
      triage: ${{ steps.render.outputs.triage }}
      critique: ${{ steps.render.outputs.critique }}
      readToken: ${{ steps.read.outputs.sealed }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionContents: read
          permissionIssues: write
          permissionPullRequests: write
          permissionOrganizationProjects: write

      # The run's 👀 (devkit#148). The webhook receiver adds it for the App's
      # dispatches, since the dispatch can't carry the comment.
      - name: React
        if: github.event_name != 'workflow_dispatch' || github.actor_id != '340770692'
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
        run: pnpm agent react --repo "$REPO" --issue "$ISSUE" ${COMMENT:+--comment "$COMMENT"}

      # Render first: with no ready plan it fails, leaving the card alone, after it
      # says why on the issue and removes the label.
      - id: memory
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          repositories: pipeline
          permissionContents: read

      - id: render
        name: Render
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MEMORY_TOKEN: ${{ steps.memory.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          # A dispatched run builds on the head of the default branch (render's
          # default): a proof run's sha is its scratch branch, whose caller differs
          # from the default branch, and the App could not push a build on top of it.
          SOURCE: ${{ inputs.issue == '' && github.sha || '' }}
          APP_ID: ${{ inputs.appId }}
          ACTOR: ${{ inputs.actor || github.actor_id }}
        run: |
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role build ${SOURCE:+--source "$SOURCE"} \
            --app-id "$APP_ID" --actor "$ACTOR" --out "$RUNNER_TEMP/agent/in"
          echo "source=$(node -p 'require(process.argv[1]).source' "$RUNNER_TEMP/agent/in/job.json")" >>"$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/agent/in/resume.json" ]; then
            node --input-type=module -e '
              import { readFileSync, appendFileSync } from "node:fs";
              const resume = JSON.parse(readFileSync(process.argv[1], "utf8"));
              appendFileSync(process.env.GITHUB_OUTPUT, ["resume=" + resume.round, "candidate=" + resume.candidate, "base=" + resume.base, ""].join("\n"));
            ' "$RUNNER_TEMP/agent/in/resume.json"
          else
            echo "base=$(node -p 'require(process.argv[1]).source' "$RUNNER_TEMP/agent/in/job.json")" >>"$GITHUB_OUTPUT"
          fi
          # A retro issue's approved plan files issues instead (devkit#115): publish does it, with no builder.
          if [ -f "$RUNNER_TEMP/agent/in/triage.json" ]; then echo "triage=true" >>"$GITHUB_OUTPUT"; fi
          pnpm agent status --repo "$REPO" --issue "$ISSUE" --status Building

      - name: Chain critique
        if: steps.render.outputs.critique == 'true'
        working-directory: devkit
        run: pnpm agent chain --role critique --from-in "$RUNNER_TEMP/agent/in" --out "$RUNNER_TEMP/critique/in"

      - uses: actions/upload-artifact@v7
        if: steps.render.outputs.critique == 'true'
        with:
          name: critique-in
          path: ${{ runner.temp }}/critique/in

      - if: steps.render.outputs.resume == ''
        uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ steps.render.outputs.source }}
          token: ${{ steps.app.outputs.token }}
          name: agent-repo

      # The builder's read token, minted last so its hour starts late.
      - id: read
        if: steps.render.outputs.triage != 'true' && steps.render.outputs.resume == ''
        uses: gingur-root/devkit/actions/agent.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          key: ${{ secrets.AGENTS_SECRETS_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: agent-in
          path: ${{ runner.temp }}/agent/in

      # Publish won't run, so the receipt ends here.
      - name: Failed
        if: failure()
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
        run: pnpm agent react --repo "$REPO" --issue "$ISSUE" --end failed

  critique:
    name: Critique
    needs: start
    if: needs.start.outputs.critique == 'true'
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: critique
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          prefix: critique
          pack: agent-repo
          source: ${{ needs.start.outputs.source }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          readToken: ${{ needs.start.outputs.readToken }}
          devkitRef: ${{ inputs.devkitRef }}

  criticism:
    name: Publish Criticism
    needs: [start, critique]
    if: ${{ !cancelled() && needs.start.result == 'success' && needs.start.outputs.critique == 'true' }}
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      pass: ${{ steps.publish.outputs.pass }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        with:
          name: critique-in
          path: ${{ runner.temp }}/critique/in

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: critique-out
          path: ${{ runner.temp }}/critique/out

      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionIssues: write
          permissionOrganizationProjects: write

      - id: publish
        name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ inputs.appId }}
        run: |
          pnpm agent publish --in "$RUNNER_TEMP/critique/in" --out "$RUNNER_TEMP/critique/out" \
            --app-id "$APP_ID"

  build:
    name: Build
    needs: [start, criticism]
    if: ${{ !cancelled() && needs.start.result == 'success' && needs.start.outputs.triage != 'true' && needs.start.outputs.resume == '' && (needs.criticism.result == 'skipped' || needs.criticism.outputs.pass == 'true') }}
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: build
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ needs.start.outputs.source }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          readToken: ${{ needs.start.outputs.readToken }}
          devkitRef: ${{ inputs.devkitRef }}

  publish:
    name: Publish
    needs: [start, build]
    # The loop reports cancelled runs; never publish their partial output.
    if: ${{ !cancelled() && needs.start.result == 'success' && needs.start.outputs.resume == '' && (needs.build.result != 'skipped' || needs.start.outputs.triage == 'true') }}
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
      readToken: ${{ steps.read.outputs.sealed }}
      criteria: ${{ steps.criteria.outputs.criteria }}
    steps:
      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionContents: write
          permissionIssues: write
          permissionPullRequests: write
          permissionOrganizationProjects: write
          # Agents push workflow files like any file (infra#150).
          permissionWorkflows: write

      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      # The push target. Its credentials stay in repo/.git for publish's git push.
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ref: ${{ needs.start.outputs.source }}
          path: repo
          token: ${{ steps.app.outputs.token }}

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        with:
          name: agent-in
          path: ${{ runner.temp }}/agent/in

      # Missing when the build job died before writing anything; publish names that stage.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: agent-out
          path: ${{ runner.temp }}/agent/out

      - id: publish
        name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          pnpm agent publish --in "$RUNNER_TEMP/agent/in" --out "$RUNNER_TEMP/agent/out" \
            --checkout "$GITHUB_WORKSPACE/repo"

      # The review's job: the pushed commit, and the build's patch as its diff.
      - id: memory
        if: steps.publish.outputs.candidate != ''
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          repositories: pipeline
          permissionContents: read

      - id: criteria
        name: Render review and verifier
        if: steps.publish.outputs.candidate != ''
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MEMORY_TOKEN: ${{ steps.memory.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          SOURCE: ${{ needs.start.outputs.source }}
          CANDIDATE: ${{ steps.publish.outputs.candidate }}
          APP_ID: ${{ inputs.appId }}
        run: |
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role review --source "$CANDIDATE" \
            --base "$SOURCE" --app-id "$APP_ID" --out "$RUNNER_TEMP/review/in"
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role verify --source "$CANDIDATE" \
            --base "$SOURCE" --app-id "$APP_ID" --out "$RUNNER_TEMP/verify/in"
          echo "criteria=$(node -p 'Object.values(require(process.argv[1]).plan.checks).includes("agent")' "$RUNNER_TEMP/verify/in/job.json")" >>"$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/agent/out/candidate.patch" "$RUNNER_TEMP/review/in/"

      - if: steps.publish.outputs.candidate != ''
        uses: actions/upload-artifact@v7
        with:
          name: verify-0-in
          path: ${{ runner.temp }}/verify/in

      - if: steps.publish.outputs.candidate != ''
        uses: actions/upload-artifact@v7
        with:
          name: review-0-in
          path: ${{ runner.temp }}/review/in

      - if: steps.publish.outputs.candidate != ''
        uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ steps.publish.outputs.candidate }}
          token: ${{ steps.app.outputs.token }}
          name: review-0-repo

      # The round-0 reviewer's read token.
      - id: read
        if: steps.publish.outputs.candidate != ''
        uses: gingur-root/devkit/actions/agent.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          key: ${{ secrets.AGENTS_SECRETS_TOKEN }}

  review:
    name: Review
    needs: [start, publish]
    # No status function would also need every job upstream of publish to succeed, and Critique is skipped when the plan has no critique.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.candidate != '' }}
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.round.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 0
      rounds: ${{ inputs.rounds }}
      base: ${{ needs.start.outputs.base }}
      candidate: ${{ needs.publish.outputs.candidate }}
      readToken: ${{ needs.publish.outputs.readToken }}
      criteria: ${{ needs.publish.outputs.criteria == 'true' }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-1:
    name: Repair 1
    needs: [start, review]
    if: ${{ !cancelled() && needs.start.result == 'success' && ((needs.review.result == 'success' && contains(fromJSON('["repair","rerun"]'), needs.review.outputs.next)) || needs.start.outputs.resume == '1') }}
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.round.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 1
      rounds: ${{ inputs.rounds }}
      base: ${{ needs.start.outputs.base }}
      rerun: ${{ needs.review.outputs.next == 'rerun' || needs.start.outputs.resume == '1' }}
      candidate: ${{ needs.review.outputs.candidate || needs.start.outputs.candidate }}
      readToken: ${{ needs.review.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-2:
    name: Repair 2
    needs: [start, repair-1]
    if: ${{ !cancelled() && needs.start.result == 'success' && ((needs.repair-1.result == 'success' && contains(fromJSON('["repair","rerun"]'), needs.repair-1.outputs.next)) || needs.start.outputs.resume == '2') }}
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.round.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 2
      rounds: ${{ inputs.rounds }}
      base: ${{ needs.start.outputs.base }}
      rerun: ${{ needs.repair-1.outputs.next == 'rerun' || needs.start.outputs.resume == '2' }}
      candidate: ${{ needs.repair-1.outputs.candidate || needs.start.outputs.candidate }}
      readToken: ${{ needs.repair-1.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-3:
    name: Repair 3
    needs: [start, repair-2]
    if: ${{ !cancelled() && needs.start.result == 'success' && ((needs.repair-2.result == 'success' && contains(fromJSON('["repair","rerun"]'), needs.repair-2.outputs.next)) || needs.start.outputs.resume == '3') }}
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.round.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 3
      rounds: ${{ inputs.rounds }}
      base: ${{ needs.start.outputs.base }}
      rerun: ${{ needs.repair-2.outputs.next == 'rerun' || needs.start.outputs.resume == '3' }}
      candidate: ${{ needs.repair-2.outputs.candidate || needs.start.outputs.candidate }}
      readToken: ${{ needs.repair-2.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-4:
    name: Repair 4
    needs: [start, repair-3]
    if: ${{ !cancelled() && needs.start.result == 'success' && ((needs.repair-3.result == 'success' && contains(fromJSON('["repair","rerun"]'), needs.repair-3.outputs.next)) || needs.start.outputs.resume == '4') }}
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.round.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 4
      rounds: ${{ inputs.rounds }}
      base: ${{ needs.start.outputs.base }}
      rerun: ${{ needs.repair-3.outputs.next == 'rerun' || needs.start.outputs.resume == '4' }}
      candidate: ${{ needs.repair-3.outputs.candidate || needs.start.outputs.candidate }}
      readToken: ${{ needs.repair-3.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-5:
    name: Repair 5
    needs: [start, repair-4]
    if: ${{ !cancelled() && needs.start.result == 'success' && ((needs.repair-4.result == 'success' && contains(fromJSON('["repair","rerun"]'), needs.repair-4.outputs.next)) || needs.start.outputs.resume == '5') }}
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.round.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 5
      rounds: ${{ inputs.rounds }}
      base: ${{ needs.start.outputs.base }}
      rerun: ${{ needs.repair-4.outputs.next == 'rerun' || needs.start.outputs.resume == '5' }}
      candidate: ${{ needs.repair-4.outputs.candidate || needs.start.outputs.candidate }}
      readToken: ${{ needs.repair-4.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-6:
    name: Repair 6
    needs: [start, repair-5]
    if: ${{ !cancelled() && needs.start.result == 'success' && ((needs.repair-5.result == 'success' && contains(fromJSON('["repair","rerun"]'), needs.repair-5.outputs.next)) || needs.start.outputs.resume == '6') }}
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.round.yml
    with:
