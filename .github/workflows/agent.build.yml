name: Build

# An /approve comment (or agent:build) on an issue with a ready plan: render
# the job from the plan comment, run the builder, then push its change to
# agent/issue-<n>, open a draft PR and move the card to Ready. Then CI
# (toolchain.verify) and Claude check that exact commit (agent.review.yml): a
# clean pass with CI green marks the PR ready
# and leaves the card in Ready for the operator to merge. Findings Codex can fix
# get up to REPAIR_ROUNDS (bin/agent/constants.ts) repair rounds on the same PR,
# one `repair-<n>` job each; anything else moves the card to Needs you.
# The pipeline never merges. Only the operator can start it (the admission
# gate), so that comment is the approval, or the App right after his dashboard
# Continue, which render checks (bin/agent/approval.ts) against the dispatcher:
# inputs.actor when the central caller dispatched the run, else github.actor_id.
# A retro issue's plan (devkit#115) skips the builder: publish files the issues
# its triage kept and closes the retro issue.
# A story (an issue with sub-issues) is refused and goes to Needs you: build
# each subtask instead (devkit#12).
# Callers set concurrency (one group per card) at their own workflow level.

on:
  workflow_call:
    inputs:
      # Required: the builder needs the runners' Codex login, so never GitHub-hosted.
      runner:
        description: 'Self-hosted runner label: callers pass vars.RUNNER.'
        type: string
        required: true
      appId:
        description: 'The pipeline App ID: callers pass vars.PIPELINE_APP_ID.'
        type: string
        required: true
      executor:
        description: "Override the builder's executor; `stub` for smoke runs."
        type: string
        required: false
        default: ''
      fixture:
        description: 'The stub fixture: `ready`, `invalid`, `needs-you`, `rate-limit`, `red`, `story` or `followups`.'
        type: string
        required: false
        default: 'ready'
      devkitRef:
        description: 'The devkit ref the jobs run.'
        type: string
        required: false
        default: 'main'
      issue:
        description: 'A manual (workflow_dispatch) run: the issue to run on. Unset on issue events.'
        type: string
        required: false
        default: ''
      actor:
        description: "The event's sender, when the central caller dispatched the run. Empty: github.actor_id."
        type: string
        required: false
        default: ''
      repo:
        description: 'The target repo in gingur-root, when the central caller (gingur-root/pipeline) dispatched the run. Empty: the calling repo.'
        type: string
        required: false
        default: ''
    secrets:
      AGENTS_SECRETS_TOKEN:
        required: true
      PIPELINE_SECRETS_TOKEN:
        required: true

permissions: {}

jobs:
  start:
    name: Start
    if: (github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))) && ((github.event_name == 'issues' && github.event.label.name == 'agent:build') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/approve') && !github.event.issue.pull_request) || (github.event_name == 'workflow_dispatch' && inputs.issue != ''))
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      source: ${{ steps.render.outputs.source }}
      triage: ${{ steps.render.outputs.triage }}
      readToken: ${{ steps.read.outputs.sealed }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionContents: read
          permissionIssues: write
          permissionOrganizationProjects: write

      # The run's 👀 (devkit#148). The webhook receiver adds it for the App's
      # dispatches, since the dispatch can't carry the comment.
      - name: React
        if: github.event_name != 'workflow_dispatch' || github.actor_id != '340770692'
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
        run: pnpm agent react --repo "$REPO" --issue "$ISSUE" ${COMMENT:+--comment "$COMMENT"}

      # Render first: with no ready plan it fails, leaving the card alone, after it
      # says why on the issue and removes the label.
      - id: render
        name: Render
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          # A dispatched run builds on the head of the default branch (render's
          # default): a proof run's sha is its scratch branch, whose caller differs
          # from the default branch, and the App could not push a build on top of it.
          SOURCE: ${{ inputs.issue == '' && github.sha || '' }}
          APP_ID: ${{ inputs.appId }}
          ACTOR: ${{ inputs.actor || github.actor_id }}
        run: |
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role build ${SOURCE:+--source "$SOURCE"} \
            --app-id "$APP_ID" --actor "$ACTOR" --out "$RUNNER_TEMP/agent/in"
          echo "source=$(node -p 'require(process.argv[1]).source' "$RUNNER_TEMP/agent/in/job.json")" >>"$GITHUB_OUTPUT"
          # A retro issue's approved plan files issues instead (devkit#115): publish does it, with no builder.
          if [ -f "$RUNNER_TEMP/agent/in/triage.json" ]; then echo "triage=true" >>"$GITHUB_OUTPUT"; fi
          pnpm agent status --repo "$REPO" --issue "$ISSUE" --status Building

      - uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ steps.render.outputs.source }}
          token: ${{ steps.app.outputs.token }}
          name: agent-repo

      # The builder's read token, minted last so its hour starts late.
      - id: read
        if: steps.render.outputs.triage != 'true'
        uses: gingur-root/devkit/actions/agent.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          key: ${{ secrets.AGENTS_SECRETS_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: agent-in
          path: ${{ runner.temp }}/agent/in

      # Publish won't run, so the receipt ends here.
      - name: Failed
        if: failure()
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
        run: pnpm agent react --repo "$REPO" --issue "$ISSUE" --end failed

  build:
    name: Build
    needs: start
    if: needs.start.outputs.triage != 'true'
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: build
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ needs.start.outputs.source }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          readToken: ${{ needs.start.outputs.readToken }}
          devkitRef: ${{ inputs.devkitRef }}

  publish:
    name: Publish
    needs: [start, build]
    if: always() && needs.start.result == 'success'
    runs-on: ${{ inputs.runner }}
    environment: agents
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
      readToken: ${{ steps.read.outputs.sealed }}
    steps:
      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionContents: write
          permissionIssues: write
          permissionPullRequests: write
          permissionOrganizationProjects: write
          # Agents push workflow files like any file (infra#150).
          permissionWorkflows: write

      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      # The push target. Its credentials stay in repo/.git for publish's git push.
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ref: ${{ needs.start.outputs.source }}
          path: repo
          token: ${{ steps.app.outputs.token }}

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        with:
          name: agent-in
          path: ${{ runner.temp }}/agent/in

      # Missing when the build job died before writing anything; publish names that stage.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: agent-out
          path: ${{ runner.temp }}/agent/out

      - id: publish
        name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          pnpm agent publish --in "$RUNNER_TEMP/agent/in" --out "$RUNNER_TEMP/agent/out" \
            --checkout "$GITHUB_WORKSPACE/repo"

      # The review's job: the pushed commit, and the build's patch as its diff.
      - name: Render review
        if: steps.publish.outputs.candidate != ''
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          SOURCE: ${{ needs.start.outputs.source }}
          CANDIDATE: ${{ steps.publish.outputs.candidate }}
          APP_ID: ${{ inputs.appId }}
        run: |
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role review --source "$CANDIDATE" \
            --base "$SOURCE" --app-id "$APP_ID" --out "$RUNNER_TEMP/review/in"
          cp "$RUNNER_TEMP/agent/out/candidate.patch" "$RUNNER_TEMP/review/in/"

      - if: steps.publish.outputs.candidate != ''
        uses: actions/upload-artifact@v7
        with:
          name: review-0-in
          path: ${{ runner.temp }}/review/in

      - if: steps.publish.outputs.candidate != ''
        uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ steps.publish.outputs.candidate }}
          token: ${{ steps.app.outputs.token }}
          name: review-0-repo

      # The round-0 reviewer's read token.
      - id: read
        if: steps.publish.outputs.candidate != ''
        uses: gingur-root/devkit/actions/agent.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          key: ${{ secrets.AGENTS_SECRETS_TOKEN }}

  review:
    name: Review
    needs: publish
    if: needs.publish.outputs.candidate != ''
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.review.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 0
      candidate: ${{ needs.publish.outputs.candidate }}
      readToken: ${{ needs.publish.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-1:
    name: Repair 1
    needs: review
    if: needs.review.outputs.repair == 'true'
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.review.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 1
      candidate: ${{ needs.review.outputs.candidate }}
      readToken: ${{ needs.review.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  repair-2:
    name: Repair 2
    needs: repair-1
    if: needs.repair-1.outputs.repair == 'true'
    # The ceiling for the nested jobs: the agents check out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.review.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      round: 2
      candidate: ${{ needs.repair-1.outputs.candidate }}
      readToken: ${{ needs.repair-1.outputs.readToken }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  # A failed job, or a review that left the card in Needs you.
  retro:
    name: Retro
    needs: [start, build, publish, review, repair-1, repair-2]
    if: always() && needs.start.result != 'skipped' && (contains(needs.*.result, 'failure') || needs.review.outputs.retro == 'true' || needs.repair-1.outputs.retro == 'true' || needs.repair-2.outputs.retro == 'true')
    # The ceiling for the nested jobs: the agent checks out this repo.
    permissions:
      contents: read
    uses: ./.github/workflows/agent.retro.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      executor: ${{ inputs.executor }}
      fixture: ${{ inputs.fixture }}
      devkitRef: ${{ inputs.devkitRef }}
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      source: ${{ needs.start.outputs.source }}
      jobs: ${{ toJSON(needs) }}
    secrets:
      AGENTS_SECRETS_TOKEN: ${{ secrets.AGENTS_SECRETS_TOKEN }}
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}

  # The run's last word, however it ended (devkit#47): a card it left in
  # Planning or Building goes to Needs you, then the repo's next ready card
  # starts planning.
  next:
    name: Next
    needs: [start, build, publish, review, repair-1, repair-2, retro]
    if: always() && needs.start.result != 'skipped'
    uses: ./.github/workflows/agent.loop.yml
    with:
      runner: ${{ inputs.runner }}
      appId: ${{ inputs.appId }}
      devkitRef: ${{ inputs.devkitRef }}
      role: build
      repo: ${{ inputs.repo }}
      issue: ${{ inputs.issue }}
      jobs: ${{ toJSON(needs) }}
    secrets:
      PIPELINE_SECRETS_TOKEN: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
