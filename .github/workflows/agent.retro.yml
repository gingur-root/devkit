name: Retro

# The pipeline's retro on its own run (devkit#39). agent.plan.yml and
# agent.build.yml call this as their last job when a job failed or the card
# ended in Needs you. Claude reads the run (the issue thread, the card's
# history, each job's result and each agent's transcript and result) and files
# its findings as one `retro` issue with `agent:plan` (devkit#115); the planner
# triages them. With no findings, or on a retro issue, it only comments. One
# retro per run, since jobs run only on a run's first attempt.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label: callers pass vars.RUNNER.'
        type: string
        required: true
      appId:
        description: 'The pipeline App ID: callers pass vars.PIPELINE_APP_ID.'
        type: string
        required: true
      executor:
        description: "Override the retro's executor; `stub` for smoke runs."
        type: string
        required: false
        default: ''
      fixture:
        description: 'The stub fixture: `ready`, `invalid`, `needs-you`, `rate-limit`, `story` or `followups`.'
        type: string
        required: false
        default: 'ready'
      devkitRef:
        description: 'The devkit ref the jobs run.'
        type: string
        required: false
        default: 'main'
      issue:
        description: 'A manual (workflow_dispatch) run: the issue to run on. Unset on issue events.'
        type: string
        required: false
        default: ''
      jobs:
        description: "The calling workflow's `toJSON(needs)`: each job's result and outputs."
        type: string
        required: true
      source:
        description: "The run's source commit, which the agent reads. Empty: the caller's sha."
        type: string
        required: false
        default: ''
      repo:
        description: 'The target repo in gingur-root, when the central caller (gingur-root/pipeline) dispatched the run. Empty: the calling repo.'
        type: string
        required: false
        default: ''
    secrets:
      AGENTS_SECRETS_TOKEN:
        required: false
      PIPELINE_SECRETS_TOKEN:
        required: false

permissions: {}

jobs:
  start:
    name: Start
    if: github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build"]'), github.event.label.name)) || (github.repository == 'gingur-root/pipeline' && github.actor_id == '340770692' && github.event_name == 'workflow_dispatch'))
    runs-on: ${{ inputs.runner }}
    environment: agents
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionContents: read
          permissionIssues: read

      # Every stage's job file, result and transcript so far, one directory each.
      # None when the run failed before its first upload.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/agent/in/run

      - id: memory
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          repositories: pipeline
          permissionContents: read

      - name: Render
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MEMORY_TOKEN: ${{ steps.memory.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ inputs.repo || github.event.repository.name }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          SOURCE: ${{ inputs.source || github.sha }}
          APP_ID: ${{ inputs.appId }}
          JOBS: ${{ inputs.jobs }}
        run: |
          # The run's repo packs are code, not its record.
          rm -rf "$RUNNER_TEMP"/agent/in/run/*-repo
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role retro --source "$SOURCE" \
            --app-id "$APP_ID" --out "$RUNNER_TEMP/agent/in"
          mkdir -p "$RUNNER_TEMP/agent/in/run"
          printf '%s\n' "$JOBS" >"$RUNNER_TEMP/agent/in/run/jobs.json"

      - id: logsToken
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionActions: read

      - name: Logs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.logsToken.outputs.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/agent/in/run/logs"
          mkdir -p "$logs"
          gh api --paginate "repos/$REPO/actions/runs/$RUN/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name, .runner_name] | @tsv' \
            >"$RUNNER_TEMP/agent/failed-jobs.tsv"
          while IFS=$'\t' read -r id job runner; do
            name=$(printf '%s' "$job" | sed 's/[^A-Za-z0-9._-]/-/g')
            file="$logs/${name:0:180}-$id.log"
            printf 'job: %s\nrunner: %s\n' "$job" "$runner" >"$file"
            if ! curl -fsSL -H @- "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" \
              <<<"Authorization: Bearer $GH_TOKEN" | tail -n 200 >>"$file"; then
              rm "$file"
              echo "::warning::Could not fetch log for job $id"
            fi
          done <"$RUNNER_TEMP/agent/failed-jobs.tsv"

      - uses: gingur-root/devkit/actions/secrets.scan@main
        with:
          path: ${{ runner.temp }}/agent/in/run/logs

      - uses: actions/upload-artifact@v7
        with:
          name: retro-in
          path: ${{ runner.temp }}/agent/in

      - uses: gingur-root/devkit/actions/repo.pack@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ inputs.source || github.sha }}
          token: ${{ steps.app.outputs.token }}
          name: retro-repo

  retro:
    name: Retro
    needs: start
    runs-on: ${{ inputs.runner }}
    environment: agents
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: retro
          prefix: retro
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ inputs.source || github.sha }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          devkitRef: ${{ inputs.devkitRef }}

  publish:
    name: Publish
    needs: retro
    runs-on: ${{ inputs.runner }}
    environment: agents
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        with:
          name: retro-in
          path: ${{ runner.temp }}/agent/in

      - uses: actions/download-artifact@v8
        with:
          name: retro-out
          path: ${{ runner.temp }}/agent/out

      - id: app
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          repositories: ${{ inputs.repo }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionIssues: write

      - name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: pnpm agent publish --in "$RUNNER_TEMP/agent/in" --out "$RUNNER_TEMP/agent/out"
