name: Retro

# The pipeline's retro on its own run (devkit#39). agent.plan.yml and
# agent.build.yml call this as their last job when a job failed or the card
# ended in Needs you. Claude reads the run (the issue thread, the card's
# history, each job's result and each agent's transcript and result) and posts
# one comment of suggested fixes. It only suggests: it changes no label, card,
# branch or PR, and the operator plans any fix himself. One retro per run,
# since jobs run only on a run's first attempt.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label: callers pass vars.RUNNER.'
        type: string
        required: false
        default: 'ubuntu-latest'
      appId:
        description: 'The pipeline App ID: callers pass vars.PIPELINE_APP_ID.'
        type: string
        required: true
      executor:
        description: "Override the retro's executor; `stub` for smoke runs."
        type: string
        required: false
        default: ''
      fixture:
        description: 'The stub fixture: `ready`, `invalid`, `needs-you` or `rate-limit`.'
        type: string
        required: false
        default: 'ready'
      devkitRef:
        description: 'The devkit ref the jobs run.'
        type: string
        required: false
        default: 'main'
      issue:
        description: 'A manual (workflow_dispatch) run: the issue to run on. Unset on issue events.'
        type: string
        required: false
        default: ''
      jobs:
        description: "The calling workflow's `toJSON(needs)`: each job's result and outputs."
        type: string
        required: true
    secrets:
      # Both unset on the WSL desk.
      AGENTS_SECRETS_TOKEN:
        required: false
      PIPELINE_SECRETS_TOKEN:
        required: false

permissions: {}

jobs:
  start:
    name: Start
    if: github.repository_owner_id == '340382989' && github.run_attempt == '1' && ((github.actor_id == '2553213' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["agent:plan","agent:build","agent:research","agent:elevated","ready-for-agent"]'), github.event.label.name)) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/revise') || startsWith(github.event.comment.body, '/approve'))))) || (github.actor_id == '340770692' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:plan'))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      # The WSL desk mints no App token: the operator's own `gh` reads there.
      - id: app
        if: inputs.runner != 'wsl'
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionIssues: read

      # Every stage's job file, result and transcript so far, one directory each.
      # None when the run failed before its first upload.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/agent/in/run

      - name: Render
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          SOURCE: ${{ github.sha }}
          APP_ID: ${{ inputs.appId }}
          JOBS: ${{ inputs.jobs }}
        run: |
          pnpm agent render --repo "$REPO" --issue "$ISSUE" --role retro --source "$SOURCE" \
            --app-id "$APP_ID" --out "$RUNNER_TEMP/agent/in"
          mkdir -p "$RUNNER_TEMP/agent/in/run"
          printf '%s\n' "$JOBS" >"$RUNNER_TEMP/agent/in/run/jobs.json"

      - uses: actions/upload-artifact@v7
        with:
          name: retro-in
          path: ${{ runner.temp }}/agent/in

  retro:
    name: Retro
    needs: start
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: gingur-root/devkit/actions/agent.run@main
        with:
          role: retro
          prefix: retro
          executor: ${{ inputs.executor }}
          fixture: ${{ inputs.fixture }}
          source: ${{ github.sha }}
          token: ${{ secrets.AGENTS_SECRETS_TOKEN }}
          devkitRef: ${{ inputs.devkitRef }}

  publish:
    name: Publish
    needs: retro
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: gingur-root/devkit
          ref: ${{ inputs.devkitRef }}
          path: devkit
          persist-credentials: false

      - uses: gingur-root/devkit/actions/toolchain.setup@main
        with:
          cwd: devkit

      - uses: actions/download-artifact@v8
        with:
          name: retro-in
          path: ${{ runner.temp }}/agent/in

      - uses: actions/download-artifact@v8
        with:
          name: retro-out
          path: ${{ runner.temp }}/agent/out

      - id: app
        if: inputs.runner != 'wsl'
        uses: gingur-root/devkit/actions/app.token@main
        with:
          appId: ${{ inputs.appId }}
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          permissionIssues: write

      # Run records go to R2 (infra runbook, "Run records"). A missing key only
      # skips the upload; it never blocks publishing.
      - id: records
        if: inputs.runner != 'wsl'
        continue-on-error: true
        uses: gingur-root/devkit/actions/secrets.fetch@main
        with:
          token: ${{ secrets.PIPELINE_SECRETS_TOKEN }}
          setEnv: 'false'
          secrets: |
            f5b1908d-d770-4a77-911a-b4e000020490 > R2_RUNS_ENDPOINT
            df25457b-e72e-4560-9ca8-b4e000020d93 > R2_RUNS_BUCKET
            bca171df-85a4-4e1e-8218-b4e0000212ec > R2_RUNS_ACCESS_KEY_ID
            613b2ff8-bb29-4d56-8d2b-b4e000021430 > R2_RUNS_SECRET_ACCESS_KEY

      - name: Publish
        working-directory: devkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          R2_RUNS: ${{ steps.records.outputs.json }}
        run: pnpm agent publish --in "$RUNNER_TEMP/agent/in" --out "$RUNNER_TEMP/agent/out"
