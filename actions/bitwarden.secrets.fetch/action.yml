name: 'Fetch Bitwarden secrets'
description: 'Fetch Bitwarden Secrets Manager secrets by UUID with bitwarden/sm-action.'

# No floating `v3` tag exists, so the release is pinned.
# sm-action exports every secret into the env of each later step in the job, so
# a job fetches only the UUIDs it uses. With `setEnv: false` nothing is
# exported; the values come back in `json` instead (see github.app.token).

inputs:
  token:
    description: 'Machine account access token (BWS_AGENTS_TOKEN or BWS_PIPELINE_TOKEN).'
    required: true
  secrets:
    description: 'One `<secret UUID> > <ENV_NAME>` per line.'
    required: true
  setEnv:
    description: 'Export the secrets into the env of later steps.'
    required: false
    default: 'true'

outputs:
  json:
    description: 'Every fetched secret as a JSON object keyed by ENV_NAME. Read with fromJSON().'
    value: ${{ toJSON(steps.fetch.outputs) }}

runs:
  using: 'composite'
  steps:
    - id: fetch
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ inputs.token }}
        secrets: ${{ inputs.secrets }}
        set_env: ${{ inputs.setEnv }}
