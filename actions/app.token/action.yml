name: 'GitHub App token'
description: 'Mint a short-lived installation token for the gingur-root pipeline App, narrowed per call.'

# The App key is fetched from Bitwarden `pipeline` without entering the job's
# env, and handed straight to actions/create-github-app-token. The App has no
# `workflows` permission, so no token from it can push .github/workflows.
# Permission inputs left empty are not requested; when all are empty the token
# carries every permission the App has.

inputs:
  appId:
    description: 'The App ID: pass vars.PIPELINE_APP_ID.'
    required: true
  token:
    description: 'PIPELINE_SECRETS_TOKEN, the pipeline-ci machine account token.'
    required: true
  repositories:
    description: 'Comma- or newline-separated repo names in gingur-root. Default: the current repo.'
    required: false
    default: ''
  allRepositories:
    description: "`true`: every repo the App's installation reaches; `repositories` is ignored."
    required: false
    default: 'false'
  revoke:
    description: '`false` keeps the token alive after the job ends, for a later job to use.'
    required: false
    default: 'true'
  permissionContents:
    description: 'read or write.'
    required: false
    default: ''
  permissionIssues:
    description: 'read or write.'
    required: false
    default: ''
  permissionPullRequests:
    description: 'read or write.'
    required: false
    default: ''
  permissionOrganizationProjects:
    description: 'read or write.'
    required: false
    default: ''

outputs:
  token:
    description: "The installation token. Revoked when the job ends unless `revoke: 'false'`; it expires after an hour either way."
    value: ${{ steps.app.outputs.token }}

runs:
  using: 'composite'
  steps:
    # The secret UUID of PIPELINE_APP_PRIVATE_KEY in Bitwarden `pipeline`
    # (gingur-root/infra runbook § Record). A UUID, not a secret.
    - id: key
      uses: gingur-root/devkit/actions/secrets.fetch@main
      with:
        token: ${{ inputs.token }}
        secrets: 826a31e9-abed-4507-9a9f-b4df0181b5c2 > PIPELINE_APP_PRIVATE_KEY # gitleaks:allow
        setEnv: 'false'

    - id: app
      uses: actions/create-github-app-token@v3
      with:
        # The App ID works as client-id: GitHub accepts either as the JWT issuer.
        client-id: ${{ inputs.appId }}
        private-key: ${{ fromJSON(steps.key.outputs.json).PIPELINE_APP_PRIVATE_KEY }}
        owner: gingur-root
        # Empty with `owner` set: every repo in the installation.
        repositories: ${{ inputs.allRepositories != 'true' && (inputs.repositories || github.event.repository.name) || '' }}
        skip-token-revoke: ${{ inputs.revoke != 'true' }}
        permission-contents: ${{ inputs.permissionContents }}
        permission-issues: ${{ inputs.permissionIssues }}
        permission-pull-requests: ${{ inputs.permissionPullRequests }}
        permission-organization-projects: ${{ inputs.permissionOrganizationProjects }}
