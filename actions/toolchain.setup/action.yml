name: 'Setup toolchain'
description: "Install Vite+, the repo's declared Node.js and package manager, and optionally its dependencies."

# Vite+ reads Node.js from .node-version and the package manager from
# package.json `packageManager`, the same files `vp` uses on a dev machine.

inputs:
  cwd:
    description: 'Directory containing the project version files and package.json.'
    required: false
    default: '.'
  node:
    description: 'Optional Node.js override. Prefer .node-version.'
    required: false
    default: ''
  install:
    description: 'Run vp install (frozen lockfile in CI) after toolchain setup.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Self-hosted runners keep their store on disk, and Actions refuses cache
    # writes from their issue-triggered jobs anyway.
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.21.2
      with:
        working-directory: ${{ inputs.cwd }}
        node-version: ${{ inputs.node }}
        run-install: ${{ inputs.install }}
        cache: ${{ inputs.install == 'true' && runner.environment == 'github-hosted' }}

    # Re-resolve the shared-config dep past the lockfile pin so CI always runs
    # against what its specifier names. No-op when the dependency is absent.
    - name: Refresh devkit
      if: ${{ inputs.install == 'true' }}
      working-directory: ${{ inputs.cwd }}
      shell: bash
      run: pnpm update @gingur-root/devkit
