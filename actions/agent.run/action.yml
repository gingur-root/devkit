name: 'Agent run'
description: 'Run one agent role on the job file the controller rendered, and upload its result. Never writes to GitHub.'

# Unpacks the target repo at the job's source commit (`<prefix>-repo`, packed by
# repo.pack in a job that holds the App token) into `repo/`, and checks devkit
# out into `devkit/`, so the agent's working tree holds only the target repo. The
# agent starts under `env -i`: with a shell it could otherwise read the job's
# whole env from /proc.

inputs:
  role:
    description: 'The role to run (bin/agent/roles.ts).'
    required: true
  executor:
    description: "Override the role's executor: `claude`, `codex`, or `stub` for smoke runs."
    required: false
    default: ''
  fixture:
    description: 'The stub fixture: `ready`, `invalid`, `needs-you` or `rate-limit`.'
    required: false
    default: 'ready'
  source:
    description: 'The commit the pack holds, from the job contract: the change is diffed against it.'
    required: true
  token:
    description: "AGENTS_SECRETS_TOKEN. Fetches the role's MCP credentials and Claude's OAuth token; Codex uses the runner login. Empty: no Bitwarden fetch (the WSL desk)."
    required: true
  devkitRef:
    description: 'The devkit ref to run.'
    required: false
    default: 'main'
  prefix:
    description: "The artifacts' prefix: reads `<prefix>-in` and `<prefix>-repo`, uploads `<prefix>-out`. A run's later stages each need their own."
    required: false
    default: 'agent'

runs:
  using: 'composite'
  steps:
    - id: pack
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-repo
        path: ${{ runner.temp }}/pack

    # A self-hosted runner keeps the workspace between jobs.
    - id: unpack
      shell: bash
      run: |
        rm -rf repo && mkdir repo
        tar -xzf "$RUNNER_TEMP/pack/repo.tgz" -C repo
        rm -rf "$RUNNER_TEMP/pack"

    - id: checkout
      uses: actions/checkout@v6
      with:
        repository: gingur-root/devkit
        ref: ${{ inputs.devkitRef }}
        path: devkit
        persist-credentials: false

    - id: toolchain
      uses: gingur-root/devkit/actions/toolchain.setup@main
      with:
        cwd: devkit

    - id: jobIn
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-in
        path: ${{ runner.temp }}/agent/in

    # CLAUDE_CODE_OAUTH_TOKEN in Bitwarden `agents` (infra runbook step 15).
    - id: secrets
      if: ${{ inputs.token != '' && inputs.executor != 'stub' && inputs.executor != 'codex' }}
      uses: gingur-root/devkit/actions/secrets.fetch@main
      with:
        token: ${{ inputs.token }}
        setEnv: 'false'
        secrets: |
          2cf223b6-0ed8-415b-a651-b4e2000da674 > CLAUDE_CODE_OAUTH_TOKEN

    - id: tools
      shell: bash
      working-directory: devkit
      env:
        ROLE: ${{ inputs.role }}
      run: |
        requests=$(pnpm --silent agent tools --role "$ROLE" --cwd "$GITHUB_WORKSPACE/repo" --secrets)
        {
          echo 'secrets<<DEVKIT_MCP_REQUESTS'
          printf '%s\n' "$requests"
          echo 'DEVKIT_MCP_REQUESTS'
        } >> "$GITHUB_OUTPUT"

    - id: mcp
      if: ${{ inputs.token != '' && inputs.executor != 'stub' && steps.tools.outputs.secrets != '' }}
      uses: gingur-root/devkit/actions/secrets.fetch@main
      with:
        token: ${{ inputs.token }}
        setEnv: 'false'
        secrets: ${{ steps.tools.outputs.secrets }}

    - name: Run
      id: run
      shell: bash
      working-directory: devkit
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.secrets.outputs.json && fromJSON(steps.secrets.outputs.json).CLAUDE_CODE_OAUTH_TOKEN }}
        DEVKIT_MCP_SECRETS: ${{ steps.mcp.outputs.json }}
        ROLE: ${{ inputs.role }}
        EXECUTOR: ${{ inputs.executor }}
        FIXTURE: ${{ inputs.fixture }}
      run: |
        out="$RUNNER_TEMP/agent/out"
        mkdir -p "$out"
        exec env -i PATH="$PATH" HOME="$HOME" LANG="${LANG:-C.UTF-8}" \
          ${CODEX_HOME:+CODEX_HOME="$CODEX_HOME"} \
          ${CLAUDE_CODE_OAUTH_TOKEN:+CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"} \
          ${DEVKIT_MCP_SECRETS:+DEVKIT_MCP_SECRETS="$DEVKIT_MCP_SECRETS"} \
          DEVKIT_STUB_FIXTURE="$FIXTURE" \
          pnpm agent run --role "$ROLE" ${EXECUTOR:+--executor "$EXECUTOR"} \
            --cwd "$GITHUB_WORKSPACE/repo" --in "$RUNNER_TEMP/agent/in" --out "$out"

    # The agent's whole change against the source, its commits included, for the
    # controller to publish. Under `env -i` too: git runs whatever hooks or
    # filters the agent left in repo/.git, so it gets the agent's access only.
    - name: Candidate
      if: ${{ always() }}
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        out="$RUNNER_TEMP/agent/out"
        mkdir -p "$out"
        git() { env -i PATH="$PATH" HOME="$HOME" git -C "$GITHUB_WORKSPACE/repo" "$@"; }
        git add -A
        git diff --cached --binary "$SOURCE" >"$out/candidate.patch"
        [ -s "$out/candidate.patch" ] || rm "$out/candidate.patch"
        # upload-artifact refuses the whole upload over one name with " : < > | * ?
        # (an agent's `fmt:check.log` lost review-0-out, devkit#150).
        find "$out" -depth -name '*[":<>|*?]*' -exec sh -c \
          'for f; do mv "$f" "$(dirname "$f")/$(basename "$f" | tr "\":<>|*?" _______)"; done' sh {} +

    # The filename matches STEPS_FILE in bin/agent/job.ts.
    - name: Steps
      if: ${{ always() }}
      shell: bash
      env:
        PACK: ${{ steps.pack.outcome }}
        UNPACK: ${{ steps.unpack.outcome }}
        CHECKOUT: ${{ steps.checkout.outcome }}
        TOOLCHAIN: ${{ steps.toolchain.outcome }}
        JOB_IN: ${{ steps.jobIn.outcome }}
        SECRETS: ${{ steps.secrets.outcome }}
        TOOLS: ${{ steps.tools.outcome }}
        MCP: ${{ steps.mcp.outcome }}
        RUN: ${{ steps.run.outcome }}
      run: |
        mkdir -p "$RUNNER_TEMP/agent/out"
        printf '{"pack":"%s","unpack":"%s","checkout":"%s","toolchain":"%s","jobIn":"%s","secrets":"%s","tools":"%s","mcp":"%s","run":"%s"}\n' \
          "$PACK" "$UNPACK" "$CHECKOUT" "$TOOLCHAIN" "$JOB_IN" "$SECRETS" "$TOOLS" "$MCP" "$RUN" \
          > "$RUNNER_TEMP/agent/out/steps.json"

    - if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.prefix }}-out
        path: ${{ runner.temp }}/agent/out
        if-no-files-found: ignore
