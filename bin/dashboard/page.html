<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --me: #e0f2fe;
        --accent: #0369a1;
        --card: #f5f5f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --fg: #f5f5f4;
          --muted: #a8a29e;
          --line: #44403c;
          --me: #0c4a6e;
          --accent: #7dd3fc;
          --card: #292524;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        height: 100dvh;
        display: grid;
        grid-template-columns: 18rem 1fr;
      }
      aside {
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 1rem;
      }
      aside h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: var(--muted);
        margin: 1rem 0 0.5rem;
      }
      aside a {
        display: block;
        padding: 0.4rem 0;
        color: var(--fg);
        text-decoration: none;
        border-bottom: 1px solid var(--line);
      }
      aside a.here {
        color: var(--accent);
      }
      aside small {
        color: var(--muted);
        display: block;
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 1.05rem;
        margin: 0;
        overflow-wrap: anywhere;
      }
      header a {
        color: var(--accent);
      }
      #status {
        color: var(--muted);
        font-size: 0.85rem;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
      }
      .msg {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0 0 1rem;
        max-width: 46rem;
      }
      .me {
        background: var(--me);
        padding: 0.5rem 0.75rem;
        border-radius: 0.75rem;
        margin-left: auto;
        width: fit-content;
      }
      .tool {
        color: var(--muted);
        font-size: 0.85rem;
      }
      details.comment {
        background: var(--card);
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        margin: 0 0 0.5rem;
        max-width: 46rem;
      }
      details.comment summary {
        color: var(--muted);
        font-size: 0.85rem;
        cursor: pointer;
      }
      details.comment div {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid var(--line);
      }
      textarea {
        flex: 1;
        font: inherit;
        resize: none;
        padding: 0.5rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: var(--bg);
      }
      .start {
        margin-top: 0.25rem;
        padding: 0.2rem 0.6rem;
        font-size: 0.85rem;
      }
      #menu {
        display: none;
      }
      @media (max-width: 700px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          display: none;
          position: fixed;
          inset: 0 20% 0 0;
          background: var(--bg);
          z-index: 1;
        }
        body.open aside {
          display: block;
        }
        #menu {
          display: block;
          background: none;
          color: var(--accent);
          padding: 0.5rem 1rem;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <a href="#" id="home-link">Home</a>
      <h2>Threads</h2>
      <div id="threads">Loading…</div>
    </aside>
    <main>
      <button id="menu" type="button">☰ Threads</button>
      <header>
        <h1 id="title">Home</h1>
        <div id="status">Ask, queue, start, or follow up on an issue.</div>
      </header>
      <div id="log" aria-live="polite"></div>
      <form id="ask">
        <textarea
          id="prompt"
          rows="2"
          placeholder="Message the coordinator"
          aria-label="Prompt"
        ></textarea>
        <button>Send</button>
      </form>
    </main>
    <script>
      const log = document.getElementById('log');
      function el(tag, props = {}, ...children) {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
      }

      // The open thread: null for home, or { repo, number } from the URL hash.
      function current() {
        const [repo, number] = decodeURIComponent(location.hash.slice(1)).split('/');
        return repo && number ? { repo, number: Number(number) } : null;
      }

      function add(text, cls) {
        log.append(el('p', { className: `msg ${cls}`, textContent: text }));
        log.scrollTop = log.scrollHeight;
      }

      function line({ role, text }) {
        add(role === 'tool' ? `· ${text.replace('mcp__github__', '')}` : text, role);
      }

      // The status line: board column plus what is running now.
      function statusLine(issue) {
        if (issue.state === 'closed') return 'Done';
        const running = issue.labels.find((l) => l.startsWith('agent:'));
        const column = issue.status ?? 'Not on the board';
        return running ? `${column} · ${running} running` : column;
      }

      async function openThread() {
        const ref = current();
        document.body.classList.remove('open');
        log.replaceChildren();
        const query = ref ? `?repo=${encodeURIComponent(ref.repo)}&number=${ref.number}` : '';
        document.getElementById('title').textContent = ref ? `${ref.repo}#${ref.number}` : 'Home';
        document.getElementById('status').textContent = 'Loading…';
        try {
          const { issue, lines } = await (await fetch(`/api/thread${query}`)).json();
          if (issue) {
            const title = document.getElementById('title');
            title.replaceChildren(
              el('a', {
                href: issue.url,
                target: '_blank',
                textContent: `${issue.repo}#${issue.number}`,
              }),
              ` ${issue.title}`,
            );
            document.getElementById('status').textContent = statusLine(issue);
            // The issue's comments are the record; the live lines follow them.
            for (const c of issue.comments.slice(-10)) {
              log.append(
                el(
                  'details',
                  { className: 'comment' },
                  el('summary', {
                    textContent: `${c.author} · ${new Date(c.at).toLocaleString()}`,
                  }),
                  el('div', { textContent: c.body }),
                ),
              );
            }
          } else {
            document.getElementById('status').textContent =
              'Ask, queue, start, or follow up on an issue.';
          }
          lines.forEach(line);
          log.scrollTop = log.scrollHeight;
        } catch {
          document.getElementById('status').textContent = 'Could not load this thread.';
        }
        loadThreads();
      }

      async function loadThreads() {
        const box = document.getElementById('threads');
        const ref = current();
        try {
          const list = await (await fetch('/api/threads')).json();
          box.replaceChildren(
            ...list.map((t) => {
              const a = el(
                'a',
                { href: `#${t.repo}/${t.number}`, textContent: t.title },
                el('small', { textContent: `${t.repo}#${t.number} ${t.labels.join(' ')}` }),
              );
              if (ref && ref.repo === t.repo && ref.number === t.number) a.className = 'here';
              // Queued asks wait in Ask until the coordinator or this button starts them.
              if (!t.labels.some((l) => l.startsWith('agent:'))) {
                const start = el('button', {
                  type: 'button',
                  className: 'start',
                  textContent: 'Start',
                });
                start.onclick = async (e) => {
                  e.preventDefault();
                  start.disabled = true;
                  const r = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ repo: t.repo, number: t.number }),
                  });
                  start.textContent = r.ok ? 'Started' : 'Failed';
                };
                a.append(start);
              }
              return a;
            }),
          );
        } catch {
          box.textContent = 'Could not load threads.';
        }
      }

      document.getElementById('menu').onclick = () => document.body.classList.toggle('open');
      document.getElementById('prompt').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          e.target.form.requestSubmit();
        }
      });

      document.getElementById('ask').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('prompt');
        const prompt = input.value.trim();
        if (!prompt) return;
        input.value = '';
        add(prompt, 'me');
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ prompt, ...current() }),
        });
        if (!response.ok) {
          add(`Error: ${await response.text()}`, 'tool');
          return;
        }
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const raw of lines.filter(Boolean)) {
            const event = JSON.parse(raw);
            if (event.type === 'text') line({ role: 'bot', text: event.text });
            else if (event.type === 'tool') line({ role: 'tool', text: event.name });
            else if (event.type === 'error') add(`Error: ${event.message}`, 'tool');
          }
        }
        loadThreads();
      };

      window.addEventListener('hashchange', openThread);
      openThread();
    </script>
  </body>
</html>
